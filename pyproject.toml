[project]
name = "llm-token-economics-lab"
version = "0.1.0"
description = "Token Economics, Cost & API Performance training labs (Groq API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_core", "src/labs"]

[project.scripts]
lab-cli = "lab_core.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live GROQ_API_KEY and makes real network calls (excluded by default)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
