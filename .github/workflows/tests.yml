name: Offline tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Compile dashboard UI
        run: uv run python -m py_compile dashboard/app.py dashboard/analytics_ui.py src/lab_core/dashboard_data.py src/lab_core/dashboard_analytics.py
      - name: Verify offline benchmark reporter CLI
        run: uv run python -m lab_core.benchmark_report --help
      - name: Check normalized v1 JSON Schema and validator CLI
        run: |
          uv run python -m json.tool schemas/normalized-measurement-v1.schema.json > /dev/null
          uv run python -m lab_core.experiment_validation --help
      - name: Check comparison CLI entry point
        run: uv run python -m lab_core.experiment_comparison --help
      - name: Run offline tests
        run: uv run pytest -q
