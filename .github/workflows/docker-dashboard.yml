name: Docker dashboard smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Build CLI + dashboard and verify health and shared results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration and port override
        run: |
          docker compose config --quiet
          DASHBOARD_PORT=8503 docker compose config --quiet
          docker compose config --format json | python -c "import json, sys; cfg=json.load(sys.stdin); ports=cfg['services']['dashboard']['ports']; assert any(p['published']=='8502' and p['target']==8501 and p['host_ip']=='127.0.0.1' for p in ports), ports"
          DASHBOARD_PORT=8503 docker compose config --format json | python -c "import json, sys; cfg=json.load(sys.stdin); ports=cfg['services']['dashboard']['ports']; assert any(p['published']=='8503' and p['target']==8501 and p['host_ip']=='127.0.0.1' for p in ports), ports"
      - name: Build independent CLI and dashboard images
        run: docker compose build lab-runner dashboard
      - name: Generate offline Lab07 results through existing CLI
        run: docker compose run --rm lab-runner lab07 all
      - name: Validate generated versioned Lab07 measurements offline
        run: |
          set -euo pipefail
          run_id=$(python -c "from pathlib import Path; print(sorted(p.name for p in Path('results/lab07_rate_limiting').iterdir() if p.is_dir())[-1])")
          docker compose run --rm --entrypoint uv lab-runner run python -m lab_core.experiment_validation \
            --experiment lab07_rate_limiting --run-id "$run_id" --strict \
            --format json --output results/validation-reports/docker-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/validation-reports/docker-smoke.json").read_text(encoding="utf-8"))
          assert report["valid"], report["diagnostics"]
          assert report["compatibility"] == "v1"
          assert report["declared_normalized_contract_version"] == 1
          assert report["records_checked"] > 0
          assert report["errors"] == 0 and report["warnings"] == 0
          print("Validated versioned offline run:", report["run_id"], "records:", report["records_checked"])
          PY
      - name: Generate and check offline benchmark report
        run: |
          set -euo pipefail
          run_id=$(python -c "from pathlib import Path; print(sorted(p.name for p in Path('results/lab07_rate_limiting').iterdir() if p.is_dir())[-1])")
          docker compose run --rm --entrypoint uv lab-runner run python -m lab_core.benchmark_report \
            --lab lab07 --run-id "$run_id" --scenario transient_failures \
            --format json --output results/benchmarks/docker-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/benchmarks/docker-smoke.json").read_text(encoding="utf-8"))
          assert report["lab"] == "lab07" and report["measurement_count"] > 0
          assert report["groups"] and all(group["simulated"] for group in report["groups"])
          assert all(group["metrics"]["estimated_cost_usd"]["observed"] == 0 for group in report["groups"])
          print("Validated offline benchmark summary for", report["run_id"])
          PY
      - name: Compare two Lab07 strategies and verify matched JSON deltas
        run: |
          set -euo pipefail
          run_id=$(python -c "from pathlib import Path; print(sorted(p.name for p in Path('results/lab07_rate_limiting').iterdir() if p.is_dir())[-1])")
          docker compose run --rm --entrypoint uv lab-runner run python -m lab_core.experiment_comparison \
            --lab lab07 --run-id "$run_id" --scenario transient_failures \
            --baseline-condition no_backoff --candidate-condition exponential_backoff \
            --format json --output results/comparisons/docker-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("results/comparisons/docker-smoke.json").read_text(encoding="utf-8"))
          assert result["comparison_report_version"] == 1
          assert result["lab"] == "lab07" and result["simulated"]
          assert result["context"]["scenario"] == "transient_failures"
          assert result["baseline"]["requests"] > 0 and result["candidate"]["requests"] > 0
          assert result["validation"]["compatibility"] == "v1"
          assert result["validation"]["warnings"] == 0
          assert result["metrics"]["retry_count"]["baseline_observed"] > 0
          assert result["metrics"]["total_tokens"]["absolute_delta"] is None
          print("Compared two simulated strategies in saved Lab07 run:", result["run_id"])
          PY
      - name: Start dashboard without any API key
        run: docker compose up -d --no-deps dashboard
      - name: Verify local health endpoint
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 35); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:8502/_stcore/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            docker compose ps
            docker compose logs dashboard
            exit 1
          fi
      - name: Exercise Advanced analytics with the real saved Lab07 run
        run: |
          docker compose exec -T dashboard python - <<'PY'
          from pathlib import Path

          from lab_core.dashboard_data import scan_results
          from lab_core.dashboard_analytics import (
              available_runs, available_scenarios, build_scoped_benchmark,
              matching_contexts, groups_for_context, compare_selected,
              comparison_rows, chart_rows,
          )
          from streamlit.testing.v1 import AppTest

          rows, warnings = scan_results(Path("/app/results"))
          lab07 = next(run for run in available_runs(rows) if run[0] == "lab07")
          scenarios = available_scenarios(rows, lab=lab07[0], run_id=lab07[1])
          assert "transient_failures" in scenarios
          report = build_scoped_benchmark(
              rows, lab=lab07[0], run_id=lab07[1], scenario="transient_failures",
          )
          contexts = matching_contexts(report)
          context = next(ctx for ctx in contexts if ctx[0] == "lab07_rate_limiting")
          groups = groups_for_context(report, context)
          baseline = next(g for g in groups if g[4] == "no_backoff")
          candidate = next(g for g in groups if g[4] == "exponential_backoff")
          compared = compare_selected(report, baseline, candidate)
          assert compared["simulated"]
          assert compared["metrics"]["retry_count"]["baseline_observed"] > 0
          assert len(comparison_rows(compared)) >= 8
          assert chart_rows(compared, "retry_count")

          app = AppTest.from_file("/app/dashboard/app.py", default_timeout=35).run()
          assert not app.exception, [str(exc.message) for exc in app.exception]
          assert "Advanced analytics" in [tab.label for tab in app.tabs]
          assert "Baseline condition" in [select.label for select in app.selectbox]
          print("Verified interactive advanced analytics tab and matched saved Lab07 values")
          PY
      - name: Assert API isolation and saved Lab07 result visibility
        run: |
          docker compose exec -T dashboard python -c "import os; assert not os.getenv('GROQ_API_KEY'), 'Dashboard must not receive Groq credentials'"
          docker compose exec -T dashboard python -c "from pathlib import Path; from lab_core.dashboard_data import scan_results; rows, warnings = scan_results(Path('/app/results')); assert any(r['lab'] == 'lab07' for r in rows), (len(rows), warnings); print('Visible Lab07 measurements:', len(rows))"
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color dashboard
      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
