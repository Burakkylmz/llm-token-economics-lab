# Default configuration for the Token Economics, Cost & API Performance labs.
#
# Safe-by-default: no real Groq API call can fire unless BOTH
#   execution.live_api_enabled = true   (here, or overridden in a local config)
#   AND the CLI is invoked with --live
# are true. This prevents accidental API costs.

[groq]
# Model used when a lab doesn't override it. Individual labs will choose
# specific models per experiment; this is only a fallback default.
# NOTE (2026-10-21 live verification): llama-3.1-8b-instant and
# llama-3.3-70b-versatile have been removed from Groq's hosted model list
# (confirmed via a real `client.models.list()` call against a live API key).
# Only openai/gpt-oss-* (20b/120b/safeguard-20b), qwen/qwen3.8-27b, and
# allam-2-7b remain as chat-capable models. Switched the default + lab05
# pair to the gpt-oss family, which also keeps prompt-caching (Lab03) demos
# consistent with the routing demo (Lab05).
default_model = "openai/gpt-oss-20b"
request_timeout_seconds = 30.0

[execution]
live_api_enabled = false
# Printed to the participant before the first live call of a run.
cost_warning_message = "This run will send real requests to the Groq API and may incur real cost on your account."

[experiment]
default_repetitions = 5
results_dir = "results"

[retry]
max_attempts = 5
base_delay_seconds = 1.0
max_delay_seconds = 30.0
jitter = true

[concurrency]
max_concurrent_requests = 5

# Pricing is USD per 1,000,000 tokens.
#
# These numbers were cross-checked against several third-party Groq pricing
# trackers (morphllm.com/groq-pricing, cloudzero.com/blog/groq-pricing,
# trevorfox.com's per-model calculators) on price_verified_date below, which
# agreed with each other. They were NOT confirmed by scraping Groq's own
# pricing page directly (it is JS-rendered and could not be read as static
# content during this project's research). RE-VERIFY against
# https://groq.com/pricing or https://console.groq.com/docs/models before
# relying on these for any real financial decision -- prices change, and
# this project's own safety rails (live_api_enabled + --live) are what
# actually protect against unwanted spend, not these numbers.
[pricing.models."llama-3.1-8b-instant"]
input_per_1m_usd = 0.05
output_per_1m_usd = 0.08
cached_input_per_1m_usd = 0.0 # not a caching-capable model (see lab03.caching_capable_models)
price_verified_date = "2026-10-21"

[pricing.models."llama-3.3-70b-versatile"]
input_per_1m_usd = 0.59
output_per_1m_usd = 0.79
cached_input_per_1m_usd = 0.0 # not a caching-capable model
price_verified_date = "2026-10-21"

# Prompt caching (Lab03) is currently only supported on these three models.
[pricing.models."openai/gpt-oss-20b"]
input_per_1m_usd = 0.075
output_per_1m_usd = 0.30
cached_input_per_1m_usd = 0.0375
price_verified_date = "2026-10-21"

[pricing.models."openai/gpt-oss-120b"]
input_per_1m_usd = 0.15
output_per_1m_usd = 0.60
cached_input_per_1m_usd = 0.075
price_verified_date = "2026-10-21"

[lab05]
# Small/fast vs large/capable model pair used by the model-routing experiments.
# (see the NOTE under [groq] above -- llama-3.1-8b-instant/llama-3.3-70b-versatile
# are no longer available; 20b vs 120b parameter count stands in for small/large.)
small_model = "openai/gpt-oss-20b"
large_model = "openai/gpt-oss-120b"

[lab03]
# Prompt caching is only supported on these Groq models today (Oct 2026).
caching_capable_models = ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]

[lab09]
batch_completion_window = "24h"

[lab01.factorial]
# Lab01's "factorial" execution mode: a full-factorial sweep over
# reasoning_effort x temperature x top_p for each prompt type, to study
# how those generation parameters affect reasoning/completion token
# consumption, latency, and cost. Entirely optional: a config file that
# omits this whole [lab01.factorial] section still runs Lab01's basic
# mode unchanged (see lab_core.config._build_lab01_factorial).
enabled = true

prompts = ["short_prompt", "long_prompt"]

# openai/gpt-oss-20b/120b (this project's models) only support these three
# reasoning_effort levels -- verified against the installed groq SDK's own
# type stub (groq==1.7.0, groq/types/chat/completion_create_params.py) and
# https://console.groq.com/docs/model/openai/gpt-oss-20b.
reasoning_efforts = ["low", "medium", "high"]

# Groq API: temperature must be in [0, 2].
temperatures = [0.5, 1.0, 1.5]

# Groq API: top_p is a nucleus-sampling probability mass, must be in (0, 1].
# NOTE: Groq's own docs recommend altering temperature OR top_p, "but not
# both" -- this factorial design deliberately varies both anyway, because
# studying that exact interaction is this experiment's point. Treat results
# that vary both at once as an exploratory interaction study, not as a
# recommended production sampling strategy.
top_p_values = [0.7, 0.9, 1.0]

repetitions = 10

# 2 unique prompts x 3 efforts x 3 temperatures x 3 top_p values = 54
# conditions x 10 repetitions = 540 total planned calls at these defaults.

# openai/gpt-oss-20b's own documented limit (console.groq.com/docs/model/
# openai/gpt-oss-20b) is 65536 max output tokens, but that is NOT used here
# as the default: at 540 calls, a limit anywhere near that would make the
# worst-case cost/runtime of one dry-run-approved execution unpredictable
# and essentially unbounded. 4096 is chosen instead because this project's
# own prior live-verified Lab01 runs (see docs/instructor/README.md) saw
# long_prompt completions around 950-1200 tokens with no reasoning_effort
# or max_completion_tokens set explicitly; 4096 leaves roughly 3-4x headroom
# over that for the added reasoning-token budget at reasoning_effort="high"
# while still bounding each call's worst case. finish_reason="length" is
# recorded on every call specifically so truncation against this limit is
# never silently invisible in the analysis.
max_completion_tokens = 4096

randomize_execution_order = true
randomization_seed = 42

# Optional: pair the same Groq API `seed` across all conditions sharing a
# repetition_index (repetition 3 of every condition uses the same api_seed,
# repetition 4 another, etc.) to make temperature/top_p/reasoning_effort
# comparisons slightly less confounded by whatever that seed happens to
# draw. Off by default: Groq's own docs say seed gives only a "best effort"
# at determinism, never a guarantee, so this is a minor variance-reduction
# aid, not a substitute for treating every result as one noisy observation.
use_paired_api_seed = false

# Request-count safety net: refuses to start a 541st call even if
# --repetitions is overridden upward on the command line. Set to exactly
# the full default matrix (54 x 10) -- raise it deliberately, never by
# accident, if you intend to run more than the documented default.
max_api_calls = 540

# Cost safety net, derived (not guessed) from this file's own [pricing] and
# max_completion_tokens above: worst case is
#   540 calls x 4096 max_completion_tokens x $0.30/1e6 (output) = $0.6636
# plus a small, imprecise prompt-token share (see
# labs.lab01_token_anatomy.factorial_runner's cost-estimation docstring for
# why that part is an approximation, not a guarantee). $1.00 leaves clear
# headroom above that completion-token ceiling while still being a real,
# enforced cap rather than "unlimited".
max_estimated_cost_usd = 1.00
