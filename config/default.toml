# Default configuration for the Token Economics, Cost & API Performance labs.
#
# Safe-by-default: no real Groq API call can fire unless BOTH
#   execution.live_api_enabled = true   (here, or overridden in a local config)
#   AND the CLI is invoked with --live
# are true. This prevents accidental API costs.

[groq]
# Model used when a lab doesn't override it. Individual labs will choose
# specific models per experiment; this is only a fallback default.
# NOTE (2026-10-21 live verification): llama-3.1-8b-instant and
# llama-3.3-70b-versatile have been removed from Groq's hosted model list
# (confirmed via a real `client.models.list()` call against a live API key).
# Only openai/gpt-oss-* (20b/120b/safeguard-20b), qwen/qwen3.8-27b, and
# allam-2-7b remain as chat-capable models. Switched the default + lab05
# pair to the gpt-oss family, which also keeps prompt-caching (Lab03) demos
# consistent with the routing demo (Lab05).
default_model = "openai/gpt-oss-20b"
request_timeout_seconds = 30.0

[execution]
live_api_enabled = false
# Printed to the participant before the first live call of a run.
cost_warning_message = "This run will send real requests to the Groq API and may incur real cost on your account."

[experiment]
default_repetitions = 5
results_dir = "results"

[retry]
max_attempts = 5
base_delay_seconds = 1.0
max_delay_seconds = 30.0
jitter = true

[concurrency]
max_concurrent_requests = 5

# Pricing is USD per 1,000,000 tokens.
#
# These numbers were cross-checked against several third-party Groq pricing
# trackers (morphllm.com/groq-pricing, cloudzero.com/blog/groq-pricing,
# trevorfox.com's per-model calculators) on price_verified_date below, which
# agreed with each other. They were NOT confirmed by scraping Groq's own
# pricing page directly (it is JS-rendered and could not be read as static
# content during this project's research). RE-VERIFY against
# https://groq.com/pricing or https://console.groq.com/docs/models before
# relying on these for any real financial decision -- prices change, and
# this project's own safety rails (live_api_enabled + --live) are what
# actually protect against unwanted spend, not these numbers.
[pricing.models."llama-3.1-8b-instant"]
input_per_1m_usd = 0.05
output_per_1m_usd = 0.08
cached_input_per_1m_usd = 0.0 # not a caching-capable model (see lab03.caching_capable_models)
price_verified_date = "2026-10-21"

[pricing.models."llama-3.3-70b-versatile"]
input_per_1m_usd = 0.59
output_per_1m_usd = 0.79
cached_input_per_1m_usd = 0.0 # not a caching-capable model
price_verified_date = "2026-10-21"

# Prompt caching (Lab03) is currently only supported on these three models.
[pricing.models."openai/gpt-oss-20b"]
input_per_1m_usd = 0.075
output_per_1m_usd = 0.30
cached_input_per_1m_usd = 0.0375
price_verified_date = "2026-10-21"

[pricing.models."openai/gpt-oss-120b"]
input_per_1m_usd = 0.15
output_per_1m_usd = 0.60
cached_input_per_1m_usd = 0.075
price_verified_date = "2026-10-21"

[lab05]
# Small/fast vs large/capable model pair used by the model-routing experiments.
# (see the NOTE under [groq] above -- llama-3.1-8b-instant/llama-3.3-70b-versatile
# are no longer available; 20b vs 120b parameter count stands in for small/large.)
small_model = "openai/gpt-oss-20b"
large_model = "openai/gpt-oss-120b"

[lab03]
# Prompt caching is only supported on these Groq models today (Oct 2026).
caching_capable_models = ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]

# Lab03's prompt-caching experiment. Unlike [lab01.factorial]/[lab01.effort]
# below, only caching_capable_models above was ever required -- everything
# below is new and optional with these exact defaults (see
# lab_core.config._build_lab03), so a config predating this redesign still
# works unchanged.

# "Default Experiment": 3 paired repetitions x 2 conditions (repeated_prefix,
# cache_unfriendly) = 6 calls. Override with `--repetitions 2` for a 4-call
# minimal pilot, or `--repetitions 4` for an 8-call extended run.
repetitions = 3

# Large enough that a short, strictly-formatted integer answer is never
# truncated by its own reasoning overhead (finish_reason="length" is still
# recorded on every call so truncation stays visible), same rationale as
# [lab02]'s max_completion_tokens below -- deliberately NOT the task
# spec's own illustrative 512, which is too tight a margin for a gpt-oss
# reasoning model on some calls.
max_completion_tokens = 2048

# At this small a scale (6-8 calls), randomizing which condition runs
# first WITHIN each pair buys little bias-reduction on its own -- the
# paired/interleaved execution order itself (pair 1: repeated_prefix,
# cache_unfriendly; pair 2: ...; never all-of-one-condition-then-all-of-
# the-other) is what actually fixes this lab's old sequential-block bias.
# Off by default, but fully supported.
randomize_condition_order_within_pair = false
randomization_seed = 42

# Request-count safety net: this project's documented "Extended Experiment"
# ceiling (4 repetitions x 2 conditions = 8 calls) -- the largest planned
# scope documented for this lab. A CLI override (--repetitions) that would
# push the plan above this is refused before any API call is made -- raise
# this deliberately, never by accident, if you intend more.
max_api_calls = 8

# Cost safety net, derived from this file's own [pricing] and
# max_completion_tokens above: worst case at the 8-call extended ceiling is
# 8 x 2048 x $0.30/1e6 (output) = $0.0049, plus a negligible prompt-token
# share. $0.05 leaves generous headroom while still being a real, enforced
# cap.
max_estimated_cost_usd = 0.05

# `lab03 cache_probe`'s own, separate, smaller budget: N sequential,
# byte-identical requests -- the strongest exact-prefix-match condition
# this project can construct, used specifically to investigate whether
# cached_tokens > 0 is ever observed. Independent of `repetitions` above.
cache_probe_calls = 3

[lab09]
batch_completion_window = "24h"

[lab04]
# Lab04's output-control/invocation-optimization experiment. Entirely
# optional (see lab_core.config._build_lab04): a config file that omits
# [lab04] entirely gets exactly these defaults, matching this project's
# documented default experiment matrix: 3 output-limit values x 2
# repetitions (6 calls) + 1 single-invocation call + 3 multiple-invocation
# calls = 10 planned calls.
enabled = true

# GPT-OSS specifically, not groq.default_model's generic fallback: this
# experiment studies reasoning-token consumption of a completion budget,
# which requires a reasoning-capable model.
model = "openai/gpt-oss-20b"

# "restrictive" / "moderate" / "generous" output-token profiles (see
# labs.lab04_output_control.experiments.OUTPUT_LIMIT_PROFILE_NAMES). No
# duplicates allowed -- each value must be a genuinely distinct condition.
output_limit_values = [64, 256, 1024]
output_limit_repetitions = 2

# openai/gpt-oss-20b/120b only support these three reasoning_effort levels
# (see SUPPORTED_REASONING_EFFORTS above). The SAME value is used for both
# of Lab04's experiments, by design.
reasoning_effort = "low"

# Deliberately generous (same rationale as lab02/lab03's own
# max_completion_tokens default): invocation_comparison studies invocation
# COUNT, not output budgeting, so its own budget must not itself truncate
# answers -- that failure mode is output_limit_sweep's subject, not this
# experiment's.
invocation_max_completion_tokens = 2048

# Only "sequential" is implemented -- concurrent execution is LAB08's
# subject, not LAB04's.
invocation_execution_mode = "sequential"

# Request-count safety net: exactly this project's documented default
# matrix (3 x 2 + 1 + 3 = 10). A CLI override that would push the plan
# above this is refused before any API call is made -- raise this
# deliberately, never by accident, if you intend more.
max_api_calls = 10

# Cost safety net, derived from this file's own [pricing] and the
# max_completion_tokens values above: worst case at the 10-call default is
# 10 x 2048 x $0.30/1e6 (gpt-oss-20b output price) = $0.00614, plus a
# negligible prompt-token share. $0.05 leaves generous headroom while
# still being a real, enforced cap.
max_estimated_cost_usd = 0.05

[lab02]
# Lab02's context-growth/context-bloat experiment. Unlike [lab01.effort]
# below, this section is NOT required for Lab02 to work: omitting it
# entirely (as this file did before this section existed) still gives you
# exactly these same defaults (see lab_core.config._build_lab02) -- they
# are baked in as the project's documented default experiment matrix: 3
# context conditions x 2 repetitions + 4 multi-turn turns = 10 calls.
enabled = true

# "Profile B -- Default Experiment": 3 context conditions x 2 repetitions
# = 6 calls. Override with `--repetitions 1` for a minimal 3-call pilot.
repetitions = 2

multi_turn_turns = 4

# Large enough that a short, strictly-formatted integer answer is never
# truncated by its own reasoning overhead (finish_reason="length" is still
# recorded on every call so truncation stays visible), but far below this
# project's factorial-scale 4096 default since Lab02's answers are
# intentionally one short token.
max_completion_tokens = 2048

# At this small a scale (10 calls), randomizing the three context
# conditions' execution order buys little bias-reduction and makes the
# terminal output harder to follow -- off by default, but fully supported
# (multi_turn_growth itself is never randomized/interleaved, since each of
# its turns depends on the previous turn's reply).
randomize_context_order = false
randomization_seed = 42

# Request-count safety net: exactly this project's documented default
# matrix (3 x 2 + 4). A CLI override (--repetitions/--turns) that would
# push the plan above this is refused before any API call is made --
# raise this deliberately, never by accident, if you intend more.
max_api_calls = 10

# Cost safety net, derived from this file's own [pricing] and
# max_completion_tokens above: worst case at the 10-call default is
# 10 x 2048 x $0.30/1e6 (output) = $0.00614, plus a negligible
# prompt-token share. $0.05 leaves generous headroom above that
# completion-token ceiling while still being a real, enforced cap.
max_estimated_cost_usd = 0.05

# [lab01.factorial] (the temperature x top_p x reasoning_effort full
# factorial engine, 540 calls by default) has been RETIRED -- it created
# real Groq rate-limit/quota pressure. The `lab01 factorial` CLI command
# still exists but now always fails closed (see
# labs.lab01_token_anatomy.cli._run_legacy_factorial_stub); it never reads
# a [lab01.factorial] section, so one lingering in your own config/live.toml
# from before this change is harmless, inert leftover -- safe to remove,
# but not required to. Use [lab01.effort] below instead.

[lab01.effort]
# Lab01's "effort" execution mode: compares reasoning_effort levels only
# (low/medium/high) for a fixed prompt. Entirely optional: a config file
# that omits this whole [lab01.effort] section still runs Lab01's basic
# mode unchanged (see lab_core.config._build_lab01_effort).
#
# temperature/top_p are deliberately NOT configuration fields here at all
# (not "0" or "unset" -- just absent): this experiment never sends them to
# the API, so the provider's own defaults apply. That does not mean they
# have zero effect on the model's output -- only that this experiment does
# not vary or observe them. See docs/instructor/README.md for the (short)
# theoretical note on what they do.
enabled = true

# Default scope: ONLY short_prompt, so the default experiment is exactly
# 1 prompt x 3 efforts x 2 repetitions = 6 calls (see `repetitions` below).
# Use `--prompt short_prompt long_prompt` on the command line to opt into
# the extended 2 x 3 x 2 = 12-call experiment without editing this file.
prompts = ["short_prompt"]

# openai/gpt-oss-20b/120b (this project's models) only support these three
# reasoning_effort levels -- verified against the installed groq SDK's own
# type stub (groq==1.7.0, groq/types/chat/completion_create_params.py) and
# https://console.groq.com/docs/model/openai/gpt-oss-20b.
reasoning_efforts = ["low", "medium", "high"]

# 2 repetitions is this project's "Profile B -- Default Experiment": 1
# prompt x 3 efforts x 2 repetitions = 6 calls. Override with
# `--repetitions 1` for a 3-call minimal pilot (API/observability smoke
# test only -- too few repetitions for any variability statistics).
repetitions = 2

# Same default and rationale as the retired factorial engine: 3-4x headroom
# over this project's prior live-verified long_prompt completions
# (950-1200 tokens, see docs/instructor/README.md), well under
# openai/gpt-oss-20b's documented 65536-token output ceiling.
# finish_reason="length" is recorded on every call so truncation against
# this limit is never silently invisible in the analysis.
max_completion_tokens = 4096

# At this much smaller scale (6-12 calls, vs. the retired engine's 540),
# randomizing call order buys little bias-reduction and makes the terminal
# output harder to follow grouped by condition -- off by default. Still
# fully supported if you want it (e.g. for the extended 12-call mode).
randomize_execution_order = false
randomization_seed = 42
use_paired_api_seed = false

# Request-count safety net. 12 = this project's "Profile C -- Extended
# Experiment" (2 prompts x 3 efforts x 2 repetitions) -- the largest planned
# scope documented for this mode. Raise it deliberately, never by accident,
# if you intend more.
max_api_calls = 12

# Cost safety net, derived (not guessed) from this file's own [pricing] and
# max_completion_tokens above: worst case for the extended (12-call) scope
# is 12 calls x 4096 max_completion_tokens x $0.30/1e6 (output) = $0.0147,
# plus a negligible prompt-token share. $0.10 leaves generous headroom
# above that completion-token ceiling while still being a real, enforced
# cap rather than "unlimited".
max_estimated_cost_usd = 0.10
